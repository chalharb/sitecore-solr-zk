---
# ConfigMap: Sitecore configset files (managed-schema, solrconfig.xml, etc.)
# These are read from the chart's files/ directory at render time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-solr-configset
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-solr-init
    {{- include "sitecore-solr.labels" . | nindent 4 }}
data:
  managed-schema: {{ .Files.Get "files/configsets/Sitecore/conf/managed-schema" | quote }}
  solrconfig.xml: {{ .Files.Get "files/configsets/Sitecore/conf/solrconfig.xml" | quote }}
  stopwords.txt: {{ .Files.Get "files/configsets/Sitecore/conf/stopwords.txt" | quote }}
  synonyms.txt: {{ .Files.Get "files/configsets/Sitecore/conf/synonyms.txt" | quote }}
---
# ConfigMap: the init script
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-solr-init-script
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-solr-init
    {{- include "sitecore-solr.labels" . | nindent 4 }}
data:
  init-solr.sh: {{ .Files.Get "files/init-solr.sh" | quote }}
---
# Job: runs once to bootstrap auth, upload configset and create collections
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-solr-init
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-solr-init
    {{- include "sitecore-solr.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-solr-init
        {{- include "sitecore-solr.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: solr-init
          image: {{ .Values.solr.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "/scripts/init-solr.sh"]
          env:
            - name: ZK_HOST
              value: {{ include "sitecore-solr.zkHost" . | quote }}
            - name: SOLR_ENDPOINT
              value: {{ include "sitecore-solr.solrEndpoint" . | quote }}
            - name: SOLR_CORE_PREFIX
              value: {{ .Values.solrInit.corePrefix | quote }}
            - name: SOLR_REPLICAS
              value: {{ .Values.solrInit.replicationFactor | quote }}
            - name: SOLR_SHARDS
              value: {{ .Values.solrInit.shardsPerCollection | quote }}
            - name: SECURITY_JSON_PATH
              value: "/tmp/security.json"
            - name: CONFIGSET_DIR
              value: "/configsets/Sitecore/conf"
            - name: SOLR_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-solr-auth
                  key: SOLR_ADMIN_USER
            - name: SOLR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-solr-auth
                  key: SOLR_ADMIN_PASSWORD
            - name: SITECORE_SOLR_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-solr-auth
                  key: SITECORE_SOLR_USER
            - name: SITECORE_SOLR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-solr-auth
                  key: SITECORE_SOLR_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: init-script
              mountPath: /scripts
              readOnly: true
            - name: sitecore-configset
              mountPath: /configsets/Sitecore/conf
              readOnly: true
            - name: security-json
              mountPath: /tmp
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: {{ .Release.Name }}-solr-init-script
            defaultMode: 0755
            items:
              - key: init-solr.sh
                path: init-solr.sh
        - name: sitecore-configset
          configMap:
            name: {{ .Release.Name }}-solr-configset
        - name: security-json
          secret:
            secretName: {{ .Release.Name }}-solr-security-json
            items:
              - key: security.json
                path: security.json
