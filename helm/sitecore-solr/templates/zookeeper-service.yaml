---
# Headless service — stable per-pod DNS for the ZK ensemble
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-zookeeper
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-zookeeper
    {{- include "sitecore-solr.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-zookeeper
  ports:
    - name: client
      port: 2181
      protocol: TCP
    - name: server
      port: 2888
      protocol: TCP
    - name: leader-election
      port: 3888
      protocol: TCP
---
# Named ClusterIP service used by Solr and the init job
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-zookeeper-client
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-zookeeper
    {{- include "sitecore-solr.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
      protocol: TCP
