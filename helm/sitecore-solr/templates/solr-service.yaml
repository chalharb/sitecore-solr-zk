---
# Headless service — stable per-pod DNS for SolrCloud inter-node traffic
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-solr-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-solr
    {{- include "sitecore-solr.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-solr
  ports:
    - name: solr
      port: 8983
      protocol: TCP
---
# Named service used by Sitecore CM/CD and the init job.
# DNS: {{ .Release.Name }}-solr.{{ .Values.namespace }}.svc.cluster.local:8983
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-solr
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-solr
    {{- include "sitecore-solr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.solr.serviceType }}
  selector:
    app: {{ .Release.Name }}-solr
  ports:
    - name: solr
      port: 8983
      targetPort: 8983
      protocol: TCP
      {{- if eq .Values.solr.serviceType "NodePort" }}
      nodePort: {{ .Values.solr.nodePort }}
      {{- end }}
