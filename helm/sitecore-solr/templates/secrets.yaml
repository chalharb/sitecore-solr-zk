apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-solr-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitecore-solr.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SOLR_ADMIN_USER: {{ .Values.auth.adminUser | quote }}
  SOLR_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  SITECORE_SOLR_USER: {{ .Values.auth.sitecoreUser | quote }}
  SITECORE_SOLR_PASSWORD: {{ .Values.auth.sitecorePassword | quote }}
  SITECORE_SOLR_CONNECTION_STRING: {{ printf "http://%s-solr.%s.svc.cluster.local:8983/solr;username=%s;password=%s;solrCloud=true" .Release.Name .Values.namespace .Values.auth.sitecoreUser .Values.auth.sitecorePassword | quote }}
---
# Minimal security.json: enables BasicAuth with blockUnknown:false and no users.
# The init job sets users via the Solr Authentication API, then locks it down.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-solr-security-json
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitecore-solr.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  security.json: |
    {
      "authentication": {
        "blockUnknown": false,
        "class": "solr.BasicAuthPlugin",
        "credentials": {},
        "realm": "Sitecore Solr",
        "forwardCredentials": false
      },
      "authorization": {
        "class": "solr.RuleBasedAuthorizationPlugin",
        "permissions": [
          { "name": "security-edit",           "role": "admin" },
          { "name": "security-read",           "role": "admin" },
          { "name": "all",                     "role": "admin" },
          { "name": "read",                    "role": ["admin", "sitecore"] },
          { "name": "update",                  "role": ["admin", "sitecore"] },
          { "name": "schema-read",             "role": ["admin", "sitecore"] },
          { "name": "schema-edit",             "role": ["admin", "sitecore"] },
          { "name": "config-read",             "role": ["admin", "sitecore"] },
          { "name": "collection-admin-read",   "role": ["admin", "sitecore"] },
          { "name": "collection-admin-edit",   "role": "admin" }
        ],
        "user-role": {}
      }
    }
