# values-local.yaml — Docker Desktop with Kubernetes (single-node)
#
# Usage (recommended — sources credentials from helm/.env):
#   ./scripts/helm-deploy-local.sh
#
# Manual usage:
#   helm upgrade --install sitecore-solr ./helm/sitecore-solr \
#     -f helm/values-local.yaml \
#     --set auth.adminPassword=<from .env> \
#     --set auth.sitecorePassword=<from .env> \
#     --set zookeeper.storage.storageClass=<from .env> \
#     --set solr.storage.storageClass=<from .env> \
#     --create-namespace
#
# StorageClass is supplied at deploy time via --set (LOCAL_STORAGE_CLASS in helm/.env).
# Default fallback if not overridden: hostpath (Docker Desktop Mac/Windows).

zookeeper:
  replicaCount: 1
  standaloneEnabled: true
  storage:
    storageClass: "hostpath"   # overridden at deploy time from helm/.env LOCAL_STORAGE_CLASS
    dataSize: "500Mi"
    datalogSize: "500Mi"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  antiAffinity: "preferred"

solr:
  replicaCount: 1
  javaMemory: "-Xms512m -Xmx768m"
  storage:
    storageClass: "hostpath"   # overridden at deploy time from helm/.env LOCAL_STORAGE_CLASS
    size: "5Gi"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  antiAffinity: "preferred"
  serviceType: ClusterIP

solrInit:
  replicationFactor: 1

# Credentials are supplied at deploy time via --set (from helm/.env).
# These fallback values are intentionally weak — they are only used if
# the deploy script is bypassed and no --set flags are passed.
auth:
  adminUser: "admin"
  adminPassword: "CHANGE_ME"
  sitecoreUser: "sitecore"
  sitecorePassword: "CHANGE_ME"

ingress:
  enabled: false
