# values-aks-single.yaml — AKS single-node (constrained quota)
#
# Used when subscription vCPU quota prevents a 3-node cluster.
# Functionally identical to the local single-node setup but running on AKS
# with Azure managed-csi storage and the NGINX ingress.
#
# Usage (recommended — sources credentials and cluster info from helm/.env):
#   ./scripts/helm-deploy-aks.sh
#
# Scale up to values-aks.yaml after requesting a quota increase:
#   portal.azure.com > Quotas > Compute > Request increase

zookeeper:
  replicaCount: 1
  standaloneEnabled: true
  storage:
    storageClass: "managed-csi"   # overridden at deploy time from helm/.env AKS_STORAGE_CLASS
    dataSize: "2Gi"
    datalogSize: "2Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  antiAffinity: "preferred"

solr:
  replicaCount: 1
  javaMemory: "-Xms1g -Xmx2g"
  storage:
    storageClass: "managed-csi"   # overridden at deploy time from helm/.env AKS_STORAGE_CLASS
    size: "20Gi"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "3Gi"
      cpu: "2000m"
  antiAffinity: "preferred"
  serviceType: ClusterIP

solrInit:
  replicationFactor: 1

# Credentials, ingress host and TLS secret are supplied at deploy time via --set
# (sourced from helm/.env by ./scripts/helm-deploy-aks.sh).
auth:
  adminUser: "admin"
  adminPassword: "CHANGE_ME"
  sitecoreUser: "sitecore"
  sitecorePassword: "CHANGE_ME"

ingress:
  enabled: true
  className: "nginx"
  host: "solr.change-me.nip.io"   # overridden at deploy time from helm/.env SOLR_INGRESS_HOST
  tlsSecretName: ""                # overridden at deploy time from helm/.env SOLR_TLS_SECRET
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
