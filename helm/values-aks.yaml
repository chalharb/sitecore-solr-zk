# values-aks.yaml — AKS production (3-node HA cluster)
#
# Usage (recommended — sources credentials and cluster info from helm/.env):
#   VALUES_FILE=helm/values-aks.yaml ./scripts/helm-deploy-aks.sh
#
# Credentials, storageClass, and ingress host are all supplied at deploy time
# via --set (sourced from helm/.env). Nothing sensitive is hardcoded here.
#
# For Entra ID auth migration after deploy, see docs/entra-id-auth.md.

zookeeper:
  replicaCount: 3
  standaloneEnabled: false
  storage:
    storageClass: "managed-premium"   # overridden at deploy time from helm/.env AKS_STORAGE_CLASS
    dataSize: "2Gi"
    datalogSize: "2Gi"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  antiAffinity: "required"

solr:
  replicaCount: 3
  javaMemory: "-Xms2g -Xmx2g"
  storage:
    storageClass: "managed-premium"   # overridden at deploy time from helm/.env AKS_STORAGE_CLASS
    size: "50Gi"
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  antiAffinity: "required"
  serviceType: ClusterIP

solrInit:
  replicationFactor: 3

# Credentials are supplied at deploy time via --set (from helm/.env).
auth:
  adminUser: "admin"
  adminPassword: "CHANGE_ME"
  sitecoreUser: "sitecore"
  sitecorePassword: "CHANGE_ME"

ingress:
  enabled: true
  className: "nginx"
  host: "solr.example.com"       # overridden at deploy time from helm/.env SOLR_INGRESS_HOST
  tlsSecretName: "solr-tls"      # overridden at deploy time from helm/.env SOLR_TLS_SECRET
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
