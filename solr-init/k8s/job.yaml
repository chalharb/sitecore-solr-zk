apiVersion: batch/v1
kind: Job
metadata:
  name: solr-init
  namespace: solr
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: solr-init
          image: <ACR_NAME>.azurecr.io/solr-init:<TAG>
          env:
            - name: SOLR_URL
              # The Solr Operator automatically creates this service.
              # Name pattern: <solrcloud-name>-solrcloud-common.<namespace>
              # Port 443 is the default for HTTPS (TLS enabled).
              value: "https://sitecore-solr-solrcloud-common.solr"
          volumeMounts:
            - name: collections-config
              mountPath: /init/collections.yml
              subPath: collections.yml
      volumes:
        - name: collections-config
          configMap:
            name: solr-collections-config
