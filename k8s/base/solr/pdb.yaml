apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: solr-pdb
  namespace: sitecore-solr
  labels:
    app: solr
    app.kubernetes.io/part-of: sitecore-solr
spec:
  # Keep at least 2 Solr nodes available during voluntary disruptions (rolling
  # upgrades, node drains).  With 3 replicas this allows 1 pod to be down.
  # Override to minAvailable: 0 when running 1 replica locally.
  minAvailable: 2
  selector:
    matchLabels:
      app: solr
