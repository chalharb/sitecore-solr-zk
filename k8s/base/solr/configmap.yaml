apiVersion: v1
kind: ConfigMap
metadata:
  name: solr-config
  namespace: sitecore-solr
  labels:
    app: solr
    app.kubernetes.io/part-of: sitecore-solr
data:
  # JVM heap size. Overlays patch this:
  #   local → "-Xms512m -Xmx1g"
  #   aks   → "-Xms2g -Xmx4g"
  SOLR_JAVA_MEM: "-Xms1g -Xmx2g"

  # Raised from the default 1000 to 3000 to accommodate Sitecore 10.4
  # installations with many custom fields and SXA components.
  SOLR_MAX_FIELDS: "3000"

  # Enables the jwt-auth module so that JWT / Entra ID auth can be
  # activated later without redeploying. See docs/entra-id-auth.md.
  SOLR_OPTS: "-Dsolr.modules=jwt-auth"
