---
# Headless service — required for stable per-pod DNS names used by SolrCloud
# internal node-to-node communication.
apiVersion: v1
kind: Service
metadata:
  name: solr-headless
  namespace: sitecore-solr
  labels:
    app: solr
    app.kubernetes.io/part-of: sitecore-solr
spec:
  clusterIP: None
  selector:
    app: solr
  ports:
    - name: solr
      port: 8983
      protocol: TCP
---
# Named ClusterIP service used by Sitecore CM/CD and the init job.
# The connection string in Sitecore secrets points to this service:
#   http://solr:8983/solr;solrCloud=true
#
# The local overlay patches this to NodePort (nodePort: 8983) so that
# the Solr dashboard is accessible at http://localhost:8983/solr.
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: sitecore-solr
  labels:
    app: solr
    app.kubernetes.io/part-of: sitecore-solr
spec:
  type: ClusterIP
  selector:
    app: solr
  ports:
    - name: solr
      port: 8983
      targetPort: 8983
      protocol: TCP
