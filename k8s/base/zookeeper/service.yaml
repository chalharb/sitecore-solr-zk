---
# Headless service — required for stable per-pod DNS names used by the
# ZooKeeper ensemble configuration (server.N=zookeeper-N.zookeeper:2888:3888)
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: sitecore-solr
  labels:
    app: zookeeper
    app.kubernetes.io/part-of: sitecore-solr
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      protocol: TCP
    - name: server
      port: 2888
      protocol: TCP
    - name: leader-election
      port: 3888
      protocol: TCP
---
# Named ClusterIP service used by Solr nodes and the init job to reach ZK
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-client
  namespace: sitecore-solr
  labels:
    app: zookeeper
    app.kubernetes.io/part-of: sitecore-solr
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
      protocol: TCP
