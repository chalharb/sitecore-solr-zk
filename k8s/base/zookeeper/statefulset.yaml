apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: sitecore-solr
  labels:
    app: zookeeper
    app.kubernetes.io/part-of: sitecore-solr
spec:
  # Base replica count is 3 (production / AKS).
  # The local overlay patches this down to 1.
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  serviceName: zookeeper          # must match the headless service name
  podManagementPolicy: Parallel   # start/stop all pods simultaneously
  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: zookeeper
        app.kubernetes.io/part-of: sitecore-solr
    spec:
      # Spread ZK pods across physical nodes so a single node failure cannot
      # take out the quorum.  The local overlay relaxes this to Preferred.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [zookeeper]
              topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

      # -----------------------------------------------------------------------
      # Init container: writes /data/myid from the StatefulSet ordinal index.
      # ZooKeeper requires a unique integer ID (1-based) for each ensemble member.
      # -----------------------------------------------------------------------
      initContainers:
        - name: zookeeper-id
          image: zookeeper:3.8
          command:
            - sh
            - -c
            - |
              # StatefulSet pod names end in -0, -1, -2 ...
              # ZooKeeper myid must be 1-based.
              ID=$(( ${HOSTNAME##*-} + 1 ))
              mkdir -p /data
              echo "${ID}" > /data/myid
              echo "ZooKeeper myid set to ${ID}"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /data

      containers:
        - name: zookeeper
          image: zookeeper:3.8
          imagePullPolicy: IfNotPresent

          ports:
            - name: client
              containerPort: 2181
            - name: server
              containerPort: 2888
            - name: leader-election
              containerPort: 3888

          env:
            # Disable standalone mode so ZK always behaves as an ensemble member,
            # even when only 1 replica is running (local dev).
            - name: ZOO_STANDALONE_ENABLED
              value: "false"

            # Allow the 4-letter-word commands needed for health probes.
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "mntr,conf,ruok"

            # Ensemble members — uses the headless service DNS.
            # All three entries are always present; ZK ignores entries that
            # refer to non-existent pods when replicas < 3.
            - name: ZOO_SERVERS
              value: >-
                server.1=zookeeper-0.zookeeper.sitecore-solr.svc.cluster.local:2888:3888;2181
                server.2=zookeeper-1.zookeeper.sitecore-solr.svc.cluster.local:2888:3888;2181
                server.3=zookeeper-2.zookeeper.sitecore-solr.svc.cluster.local:2888:3888;2181

            # Bind on all interfaces so ZK pods can talk to each other across nodes.
            - name: ZOO_CFG_EXTRA
              value: "quorumListenOnAllIPs=true electionPortBindRetry=0"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          volumeMounts:
            - name: zookeeper-data
              mountPath: /data
            - name: zookeeper-datalog
              mountPath: /datalog

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  OK=$(echo ruok | nc -w 2 127.0.0.1 2181)
                  [ "$OK" = "imok" ]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  OK=$(echo ruok | nc -w 2 127.0.0.1 2181)
                  [ "$OK" = "imok" ]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName is left unset here so it uses the cluster default.
        # Overlays patch this:
        #   local → standard (Docker Desktop)
        #   aks   → managed-premium
        resources:
          requests:
            storage: 1Gi

    - metadata:
        name: zookeeper-datalog
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
