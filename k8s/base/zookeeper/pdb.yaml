apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: sitecore-solr
  labels:
    app: zookeeper
    app.kubernetes.io/part-of: sitecore-solr
spec:
  # Allow at most 1 ZK pod to be unavailable at a time.
  # With 3 replicas this tolerates 1 voluntary disruption while maintaining quorum.
  # Override to maxUnavailable: 0 (or omit the PDB) when running 1 replica locally.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: zookeeper
