# =============================================================================
# security-json.yaml — Solr security.json uploaded to ZooKeeper by solr-init
#
# Enables BasicAuthPlugin with two users:
#   admin    / admin      — full admin access (dashboard + API)
#   sitecore / SolrRocks  — Sitecore CM/CD service account (all collections)
#
# Password hashes are in Solr's PBKDF2-SHA256 format:
#   <base64(hash)> <base64(salt)>
#
# This file bootstraps BasicAuth with blockUnknown:false and NO users.
# The solr-init job sets passwords via the Solr Authentication API (set-user),
# which lets Solr hash them internally with its own algorithm.
# After setting users, blockUnknown is set to true via set-property.
#
# IMPORTANT: Change the credentials in secrets/solr-auth.yaml before deploying
#            to AKS. The Entra ID migration path is documented in docs/entra-id-auth.md.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: solr-security-json
  namespace: sitecore-solr
  labels:
    app.kubernetes.io/part-of: sitecore-solr
type: Opaque
stringData:
  security.json: |
    {
      "authentication": {
        "blockUnknown": false,
        "class": "solr.BasicAuthPlugin",
        "credentials": {},
        "realm": "Sitecore Solr",
        "forwardCredentials": false
      },
      "authorization": {
        "class": "solr.RuleBasedAuthorizationPlugin",
        "permissions": [
          { "name": "security-edit",           "role": "admin" },
          { "name": "security-read",           "role": "admin" },
          { "name": "all",                     "role": "admin" },
          { "name": "read",                    "role": ["admin", "sitecore"] },
          { "name": "update",                  "role": ["admin", "sitecore"] },
          { "name": "schema-read",             "role": ["admin", "sitecore"] },
          { "name": "schema-edit",             "role": ["admin", "sitecore"] },
          { "name": "config-read",             "role": ["admin", "sitecore"] },
          { "name": "collection-admin-read",   "role": ["admin", "sitecore"] },
          { "name": "collection-admin-edit",   "role": "admin" }
        ],
        "user-role": {}
      }
    }
