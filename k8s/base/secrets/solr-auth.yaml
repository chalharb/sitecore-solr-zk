# =============================================================================
# solr-auth.yaml — Solr authentication credentials
#
# IMPORTANT: This file contains placeholder credentials for local development.
#
# For AKS production:
#   - Replace values with strong, unique passwords.
#   - Use Azure Key Vault + the CSI Secrets Store driver, or Sealed Secrets,
#     to manage secrets rather than committing them to source control.
#   - The SITECORE_SOLR_* vars are placed in the Sitecore deployment secret
#     (sitecore-solr-connection-string) in the format expected by Sitecore:
#       http://solr:8983/solr;username=<user>;password=<pass>;solrCloud=true
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: solr-auth
  namespace: sitecore-solr
  labels:
    app.kubernetes.io/part-of: sitecore-solr
type: Opaque
stringData:
  # Solr Admin UI login — change before deploying to AKS
  SOLR_ADMIN_USER: "admin"
  SOLR_ADMIN_PASSWORD: "admin"

  # Sitecore CM/CD service account — change before deploying to AKS
  SITECORE_SOLR_USER: "sitecore"
  SITECORE_SOLR_PASSWORD: "SolrRocks"

  # Full Sitecore connection string (used in Sitecore CM/CD secrets)
  SITECORE_SOLR_CONNECTION_STRING: "http://solr.sitecore-solr.svc.cluster.local:8983/solr;username=sitecore;password=SolrRocks;solrCloud=true"
