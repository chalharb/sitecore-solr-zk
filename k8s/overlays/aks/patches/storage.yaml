# Patch: use Azure managed-premium StorageClass for AKS production PVCs.
# managed-premium = Azure Premium SSD (P10/P20/P30 based on size).
# For lower cost dev/staging use "managed" (Standard HDD) or "managed-csi".
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: sitecore-solr
spec:
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        storageClassName: managed-premium
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: zookeeper-datalog
      spec:
        storageClassName: managed-premium
        resources:
          requests:
            storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: sitecore-solr
spec:
  volumeClaimTemplates:
    - metadata:
        name: solr-data
      spec:
        storageClassName: managed-premium
        resources:
          requests:
            storage: 50Gi
