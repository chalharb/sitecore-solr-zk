# Patch: relax pod anti-affinity from Required to Preferred for local clusters.
# With only 1 node in Docker Desktop, Required anti-affinity would prevent
# the pods from being scheduled at all.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: sitecore-solr
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [zookeeper]
                topologyKey: kubernetes.io/hostname
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: sitecore-solr
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [solr]
                topologyKey: kubernetes.io/hostname
