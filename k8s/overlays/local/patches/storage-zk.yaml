# JSON 6902 patch: ZooKeeper storage (2 VolumeClaimTemplates: data + datalog)
#
# Docker Desktop StorageClass options:
#   - "hostpath"   — Docker Desktop for Mac/Windows (most common)
#   - "local-path" — Rancher Desktop / k3s
# Change the storageClassName values below to match your local setup.
- op: replace
  path: /spec/volumeClaimTemplates/0/spec/storageClassName
  value: hostpath
- op: replace
  path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
  value: 500Mi
- op: replace
  path: /spec/volumeClaimTemplates/1/spec/storageClassName
  value: hostpath
- op: replace
  path: /spec/volumeClaimTemplates/1/spec/resources/requests/storage
  value: 500Mi
