# Patch: reduce replica counts for local Docker Desktop K8s.
# Runs ZooKeeper and Solr as single-node (no HA) to conserve laptop resources.
# To switch to a 3-node cluster locally, change both values to 3.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: sitecore-solr
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: sitecore-solr
spec:
  replicas: 1
