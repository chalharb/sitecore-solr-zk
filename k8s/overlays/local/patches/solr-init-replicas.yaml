# Patch: set replicationFactor=1 for the init job when running locally.
# Collections are created with 1 replica to match the single Solr node.
apiVersion: batch/v1
kind: Job
metadata:
  name: solr-init
  namespace: sitecore-solr
spec:
  template:
    spec:
      containers:
        - name: solr-init
          env:
            - name: SOLR_REPLICAS
              value: "1"
            - name: ZK_HOST
              value: "zookeeper-client.sitecore-solr.svc.cluster.local:2181"
            - name: SOLR_ENDPOINT
              value: "http://solr.sitecore-solr.svc.cluster.local:8983/solr"
